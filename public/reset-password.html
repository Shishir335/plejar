<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plezar // Reset Your Password</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <style>
    .reset-container {
      max-width: 460px;
      margin: 80px auto;
      padding: 0 20px;
    }
    .reset-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 36px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-lg);
    }
    .reset-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .reset-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 12px;
      letter-spacing: -0.02em;
    }
    .reset-subtitle {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 6px;
    }
    .alert-box {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }
    .alert-box.error {
      display: block;
      background: var(--color-danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .alert-box.success {
      display: block;
      background: var(--color-success-bg);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="/" class="brand">
        <div class="brand-icon">P</div>
        <span>Plezar</span>
      </a>
      <a href="/" class="btn btn-secondary btn-sm">&larr; Back to Home</a>
    </div>
  </header>

  <main class="reset-container">
    <div class="reset-card">
      <div class="reset-header">
        <div class="brand-icon" style="margin: 0 auto; width: 44px; height: 44px; font-size: 1.2rem;">🔒</div>
        <h1 class="reset-title">Reset Your Password</h1>
        <p class="reset-subtitle">Enter a new secure password with at least 8 characters.</p>
      </div>

      <div id="resetAlertBox" class="alert-box"></div>

      <form id="resetPwdForm" onsubmit="handleResetSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password (Min 8 Characters)</label>
          <input type="password" id="newPassword" class="form-input" placeholder="••••••••" minlength="8" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" minlength="8" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary" id="resetSubmitBtn" style="width: 100%; margin-top: 8px;">
          Update Password &amp; Sign In
        </button>

        <p style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted);">
          Remembered your password? <a href="/">Return to Home</a>
        </p>
      </form>
    </div>
  </main>

  <script>
    function getResetToken() {
      const urlParams = new URLSearchParams(window.location.search);
      let token = urlParams.get('token');
      if (!token) {
        const parts = window.location.pathname.split('/');
        token = parts[parts.length - 1];
      }
      return token;
    }

    async function handleResetSubmit(e) {
      e.preventDefault();
      const password = document.getElementById('newPassword')?.value;
      const confirmPassword = document.getElementById('confirmPassword')?.value;
      const submitBtn = document.getElementById('resetSubmitBtn');
      const token = getResetToken();

      if (!token || token === 'reset-password' || token === 'reset-password.html') {
        showAlert('Invalid or missing password reset token. Please request a new link.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Passwords do not match.', 'error');
        return;
      }

      if (password.length < 8) {
        showAlert('Password must contain at least 8 characters.', 'error');
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating password...';

        const res = await fetch(`/api/v1/users/resetPassword/${encodeURIComponent(token)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password, confirmPassword })
        });

        const data = await res.json();
        if (!res.ok || data.status !== 'success') {
          throw new Error(data.message || 'Token is invalid or expired.');
        }

        if (data.token) {
          localStorage.setItem('plezar_token', data.token);
        }

        // Send people back to the panel they use
        const role = data.data && data.data.role;
        const target = ['admin', 'manager', 'dev'].includes(role) ? '/admin' : role === 'agent' ? '/agent' : '/';
        showAlert('Password updated. Signing you in...', 'success');
        setTimeout(() => {
          window.location.href = target;
        }, 1500);
      } catch (err) {
        showAlert(err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password & Sign In';
      }
    }

    function showAlert(msg, type) {
      const box = document.getElementById('resetAlertBox');
      if (box) {
        box.className = `alert-box ${type}`;
        box.textContent = msg;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const token = getResetToken();
      if (!token || token === 'reset-password' || token === 'reset-password.html') {
        showAlert('No reset token found in this link. Please request a password reset from the home page.', 'error');
      }
    });
  </script>
</body>
</html>
